name: Feedback on scope
description: Disagree with what the AWS provider covers or leaves out? Tell us what we should change.
title: "[Scope] "
labels: ["scope", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        What the provider covers, and what it leaves out, is documented in the [README](https://github.com/cloudfit-io/cloudfit-provider-aws/blob/main/README.md#not-included). This issue type is for arguing what should be added, removed, or reprioritized.

        For requests for specific instance types or regions, use the [Request AWS support](https://github.com/cloudfit-io/cloudfit-provider-aws/issues/new?template=aws-support-request.yml) template instead.

  - type: textarea
    id: change-requested
    attributes:
      label: What should change in the scope?
      description: Be specific. Reference the "Not included" table from the README.
      placeholder: "e.g. Spot pricing should come before Savings Plans."
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why?
      description: What workload, constraint, or use case makes this important enough to change the plan?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What would you do if this isn't added soon?
      description: Helps us understand whether deferring is acceptable or a hard blocker.
    validations:
      required: false
