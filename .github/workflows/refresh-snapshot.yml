name: Refresh snapshot

# Weekly rebuild of the AWS snapshot bundled by cloudfit-api and cloudfit-ui,
# from AWS's public EC2 price list (no AWS credentials needed). The new
# snapshot is proposed as a pull request in each repo, where CI runs on it.
# See examples/generate_snapshot.py.
#
# Required configuration
# ----------------------
# Secrets:
#   SNAPSHOT_TOKEN  A fine-grained PAT (or app token) with Contents: write and
#                   Pull requests: write on cloudfit-io/cloudfit-api and
#                   cloudfit-io/cloudfit-ui. Used to check those repos out and
#                   open PRs (the default GITHUB_TOKEN cannot reach other repos,
#                   and PRs it opens do not trigger their CI).

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays at 07:00 UTC, an hour after the GCP refresh
  workflow_dispatch: {}    # allow manual runs

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

permissions:
  contents: read
  issues: write            # token-expiry reminder issue

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Warn ahead of SNAPSHOT_TOKEN expiry: GitHub reports a fine-grained token's
      # expiry in a response header. Under 30 days left, open an issue here (once).
      - name: Check SNAPSHOT_TOKEN expiry
        env:
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          exp=$(curl -sI -H "Authorization: Bearer $SNAPSHOT_TOKEN" \
            https://api.github.com/repos/cloudfit-io/cloudfit-api \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "github-authentication-token-expiration" {print $2}')
          if [ -z "$exp" ]; then
            echo "SNAPSHOT_TOKEN reports no expiry."
            exit 0
          fi
          days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
          echo "SNAPSHOT_TOKEN expires $exp ($days days)."
          if [ "$days" -lt 30 ]; then
            echo "::warning::SNAPSHOT_TOKEN expires in $days days ($exp)."
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "SNAPSHOT_TOKEN expires in:title" --json number --jq 'length')
            if [ "$open" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "SNAPSHOT_TOKEN expires in $days days" \
                --body "The token the weekly snapshot refresh uses to open pull requests in cloudfit-api and cloudfit-ui expires on $exp. After that, the refresh fails.

          To renew: create a fine-grained token with Contents and Pull requests read/write on cloudfit-api and cloudfit-ui only, then replace the \`SNAPSHOT_TOKEN\` secret in both cloudfit-provider-gcp and cloudfit-provider-aws. Close this issue once done."
            fi
          fi

      - name: Check out cloudfit-provider-aws
        uses: actions/checkout@v7

      - name: Check out cloudfit-api
        uses: actions/checkout@v7
        with:
          repository: cloudfit-io/cloudfit-api
          path: cloudfit-api
          token: ${{ secrets.SNAPSHOT_TOKEN }}

      - name: Check out cloudfit-ui
        uses: actions/checkout@v7
        with:
          repository: cloudfit-io/cloudfit-ui
          path: cloudfit-ui
          token: ${{ secrets.SNAPSHOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install provider
        run: pip install -e .

      # Fails, writing nothing, if any region comes back empty.
      - name: Rebuild the snapshot from the public price list
        run: |
          python examples/generate_snapshot.py --output cloudfit-api/data/aws_snapshot.json
          cp cloudfit-api/data/aws_snapshot.json cloudfit-ui/data/aws_snapshot.json

      # The demo shows when its AWS data was last refreshed; keep that date in
      # step with the data, but only when the snapshot actually changed.
      - name: Update cloudfit-ui snapshot date
        run: |
          if ! git -C cloudfit-ui diff --quiet -- data/aws_snapshot.json; then
            sed -i -E "s/^AWS_SNAPSHOT_DATE = \"[0-9-]+\"/AWS_SNAPSHOT_DATE = \"$(date -u +%F)\"/" cloudfit-ui/app.py
          fi

      - name: Open PR in cloudfit-api
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SNAPSHOT_TOKEN }}
          path: cloudfit-api
          commit-message: "chore: refresh AWS snapshot"
          branch: chore/refresh-aws-snapshot
          delete-branch: true
          title: "chore: refresh AWS snapshot"
          body: |
            Automated weekly rebuild of the AWS snapshot from AWS's public EC2
            price list (instance types, on-demand and 1-year reserved prices).
            Generated by cloudfit-provider-aws's refresh-snapshot workflow.

      - name: Open PR in cloudfit-ui
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SNAPSHOT_TOKEN }}
          path: cloudfit-ui
          commit-message: "chore: refresh AWS snapshot"
          branch: chore/refresh-aws-snapshot
          delete-branch: true
          title: "chore: refresh AWS snapshot"
          body: |
            Automated weekly rebuild of the AWS snapshot from AWS's public EC2
            price list (instance types, on-demand and 1-year reserved prices).
            Generated by cloudfit-provider-aws's refresh-snapshot workflow.
