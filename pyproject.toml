[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudfit-provider-aws"
version = "0.1.0"
description = "AWS EC2 provider plugin for cloudfit-core"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Chaitanya Krishna Kasaraneni", email = "kc.kasaraneni@gmail.com" }
]
keywords = [
  "cloud", "aws", "ec2", "instance-type",
  "bioinformatics", "cloudfit", "instance-recommendation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
  "cloudfit-core>=0.9.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "ruff>=0.15,<0.16",
  "mypy",
]

[project.urls]
Homepage = "https://github.com/cloudfit-io/cloudfit-provider-aws"
Repository = "https://github.com/cloudfit-io/cloudfit-provider-aws"
"Bug Tracker" = "https://github.com/cloudfit-io/cloudfit-provider-aws/issues"
ORCID = "https://orcid.org/0000-0001-5792-1095"

[tool.hatch.build.targets.wheel]
packages = ["cloudfit_provider_aws"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
